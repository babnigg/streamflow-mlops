# Single source of truth - modules read from here rather than hardcoding.

project:
  name: streamflow-mlops
  course: "ADSP 32021 - MLOps"
  team: "Team 3 (Tori, Janvi, Daniel, Saya)"

site:
  id: "USGS-05532500"
  usgs_site: "05532500"
  name: "Des Plaines River at Riverside, IL"
  latitude: 41.8214916666667
  longitude: -87.8220361111111
  drainage_area_sqmi: 630.0

usgs:
  ogc_base: "https://api.waterdata.usgs.gov/ogcapi/v0"
  parameter_code: "00060"      # streamflow, cfs (USGS calls this parameter "discharge")
  statistic_id: "00003"        # daily mean
  page_size: 10000

weather:
  archive_url: "https://archive-api.open-meteo.com/v1/archive"   # ERA5 history
  forecast_url: "https://api.open-meteo.com/v1/forecast"
  daily_vars: ["precipitation_sum", "temperature_2m_max", "temperature_2m_min"]
  timezone: "America/Chicago"

data:
  start_date: "1944-01-01"
  raw_path: "data/raw/streamflow.parquet"
  features_path: "data/features/feature_matrix.parquet"

# tracking_uri is overridden by the MLFLOW_TRACKING_URI env var in the container.
mlflow:
  tracking_uri: "file:./mlruns"
  experiment_deploy: "streamflow_xgboost_deploy"
  experiment_tune: "streamflow_xgboost_tuning"
  best_params_path: "config/best_params.yaml"

# Chronological hold-out. purge_days must be >= the longest lag/rolling window
# in features.py, or train and test share history.
split:
  test_size: 0.15
  purge_days: 30

target:
  variable: "next-day mean streamflow (cfs)"
  transform: "log"
  # nse is reported for hydrology convention; persistence_index is what we
  # monitor on - it scores against persistence rather than the observed mean,
  # so PI < 0 means the model is worse than doing nothing.
  metrics: ["nse", "persistence_index", "log_rmse"]
  baseline: "persistence"
  monitor_metric: "persistence_index"
  monitor_alert_below: 0.0
