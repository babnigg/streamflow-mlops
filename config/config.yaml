# Single source of truth - modules read from here rather than hardcoding.

project:
  name: streamflow-mlops
  course: "ADSP 32021 - MLOps"
  team: "Team 3 (Tori, Janvi, Daniel, Saya)"

site:
  id: "USGS-05532500"
  usgs_site: "05532500"
  name: "Des Plaines River at Riverside, IL"
  latitude: 41.8214916666667
  longitude: -87.8220361111111
  drainage_area_sqmi: 630.0

usgs:
  ogc_base: "https://api.waterdata.usgs.gov/ogcapi/v0"
  parameter_code: "00060"      # streamflow, cfs (USGS calls this parameter "discharge")
  statistic_id: "00003"        # daily mean
  page_size: 10000

weather:
  archive_url: "https://archive-api.open-meteo.com/v1/archive"   # ERA5 history
  forecast_url: "https://api.open-meteo.com/v1/forecast"
  daily_vars: ["precipitation_sum", "temperature_2m_max", "temperature_2m_min"]
  timezone: "America/Chicago"

data:
  start_date: "1944-01-01"
  raw_path: "data/raw/streamflow.parquet"
  features_path: "data/features/feature_matrix.parquet"

# tracking_uri is overridden by the MLFLOW_TRACKING_URI env var in the container.
mlflow:
  tracking_uri: "file:./mlruns"
  experiment_deploy: "streamflow_xgboost_deploy"
  experiment_tune: "streamflow_xgboost_tuning"
  best_params_path: "config/best_params.yaml"

# Chronological hold-out. purge_days must be >= the longest lag/rolling window
# in features.py, or train and test share history.
split:
  test_size: 0.15
  purge_days: 30

# Windows are durations so a move to hourly data is a config change. Thresholds
# are calibrated from a backtest (monitor.calibrate_pi_threshold), not copied
# from literature - at a different cadence they must be re-derived, not reused.
monitoring:
  pi_window_days: 60          # 0/64 non-overlapping blocks fell below 0 over a 10.5y backtest
  pi_alert_below: 0.0         # PI < 0 = worse than persistence
  # ML Test Score Monitor 4: a model that is merely old is a known risk even
  # before performance drops. Retrains are cheap here, so keep this tight.
  max_model_age_days: 30
  drift_window_days: 90       # daily cadence: shorter windows are statistically underpowered
  drift_share: 0.5            # fraction of watched columns that must drift
  psi_threshold: 0.2          # reported default; per-column alarms use the values below
  # Calibrated, not borrowed. PSI 0.2 is the textbook cutoff, but on 90-day daily
  # windows every known-clean historical window exceeded it - streamflow alone
  # sits near 0.68 in a quiet quarter. These are set above the clean maximum per
  # column, so an undisturbed window is quiet and a real shift still stands out.
  # Re-derive with notebooks/05_monitoring (they will tighten at hourly cadence).
  psi_thresholds:
    streamflow_t: 1.6
    precip_mm: 0.5
    tmax_c: 0.5
    tmin_c: 1.0
  # the drift reference is the same season in recent years, not a calendar window:
  # season fixes "every summer looks drifted", recency avoids comparing against
  # decades of a different river regime.
  reference_pad_days: 7
  reference_years: 10
  # raw drivers + prediction only. The 48 lag/rolling features are deterministic
  # transforms of one series, so a single shift registers ~48 times.
  watch_columns: ["streamflow_t", "precip_mm", "tmax_c", "tmin_c"]
  predictions_path: "data/monitoring/predictions.parquet"
  alerts_path: "data/monitoring/alerts.parquet"
  reports_dir: "reports"

target:
  variable: "next-day mean streamflow (cfs)"
  transform: "log"
  # nse is reported for hydrology convention; persistence_index is what we
  # monitor on - it scores against persistence rather than the observed mean,
  # so PI < 0 means the model is worse than doing nothing.
  metrics: ["nse", "persistence_index", "log_rmse"]
  baseline: "persistence"
