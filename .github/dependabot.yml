version: 2

# ML Test Score, Monitor 1: "dependencies have changed". Pinning tells us what
# we depend on; this tells us when it moves. A model trained under one xgboost
# and served under another is a silent train/serve skew, and the pins are the
# only thing preventing it.
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # one PR per week carrying every update, rather than one per package: the
    # point is a notification we act on, not a queue nobody reads
    open-pull-requests-limit: 1
    groups:
      python-packages:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
