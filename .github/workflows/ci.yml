name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.2"
          cache: pip

      - run: pip install -r requirements.txt

      # ruff is pinned in requirements.txt: an unpinned linter turns a new
      # release into a red build on a commit that changed nothing
      - run: ruff check streamflow/ tests/ flows/

      # The suite needs no data, model, network or secrets: fixtures are
      # synthetic and the two tests that would need a live API skip themselves.
      # Anything that starts reaching for the network belongs behind RUN_LIVE.
      - run: pytest -q

  # Serving is the graded artifact, so a broken Dockerfile should fail the build
  # rather than surface during the demo. Not pushed anywhere - the deploy step
  # in this project is moving the MLflow champion alias.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t streamflow-api .
