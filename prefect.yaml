# Welcome to your prefect.yaml file! You can use this file for
# storing and managing configuration for deploying your flows.
# We recommend committing this file to source control along
# with your flow code.

# Generic metadata about this project
name: streamflow-mlops
prefect-version: 3.8.1

# build section allows you to manage and build docker images
build:

# push section allows you to manage if and how this project
# is uploaded to remote locations
push:

# pull section allows you to provide instructions for cloning
# this project in remote locations
# no pull step: flows run from the repo root wherever it is checked out.
# (a hardcoded absolute path here breaks on every machine but the one it was written on)
pull:

# the deployments section allows you to provide configuration
# for deploying flows
deployments:
- name: daily-run
  version:
  tags: []
  concurrency_limit:
  description:
  entrypoint: flows/pipeline.py:daily_pipeline
  parameters: {}
  work_pool:
    name: default
    work_queue_name:
    job_variables: {}
  schedules:
  - cron: 0 6 * * *
    timezone:
    day_or: true
- name: manual-tune
  version:
  tags: []
  concurrency_limit:
  description:
  entrypoint: flows/pipeline.py:tuning_flow
  parameters: {}
  work_pool:
    name: default
    work_queue_name:
    job_variables: {}
  schedules: []
- name: manual-retrain
  version:
  tags: []
  concurrency_limit:
  description:
  entrypoint: flows/pipeline.py:retrain_flow
  parameters: {}
  work_pool:
    name: default
    work_queue_name:
    job_variables: {}
  schedules: []
