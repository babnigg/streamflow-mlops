name: streamflow-mlops
prefect-version: 3.8.1

build:

push:

# Deliberately empty: flows run from the repo root wherever it is checked out.
pull:

deployments:
- name: daily-run
  version:
  tags: []
  concurrency_limit:
  description:
  entrypoint: flows/pipeline.py:daily_pipeline
  parameters: {}
  work_pool:
    name: default
    work_queue_name:
    job_variables: {}
  schedules:
  - cron: 0 6 * * *
    timezone:
    day_or: true
- name: manual-tune
  version:
  tags: []
  concurrency_limit:
  description:
  entrypoint: flows/pipeline.py:tuning_flow
  parameters: {}
  work_pool:
    name: default
    work_queue_name:
    job_variables: {}
  schedules: []
- name: manual-retrain
  version:
  tags: []
  concurrency_limit:
  description:
  entrypoint: flows/pipeline.py:retrain_flow
  parameters: {}
  work_pool:
    name: default
    work_queue_name:
    job_variables: {}
  schedules: []
